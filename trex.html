<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Rex Game - dimhyena2222's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .stats {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
        }

        #gameCanvas {
            border: 2px solid #000;
            background: #fff;
            display: block;
            cursor: pointer;
        }

        .controls {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #000;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #666;
        }

        .game-over-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 2px solid #000;
            padding: 40px;
            border-radius: 4px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .game-over-screen.active {
            display: block;
        }

        .game-over-screen h2 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #000;
        }

        .try-again-btn {
            padding: 14px 40px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .try-again-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <div class="container">
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="200"></canvas>

        <div class="controls">
            <p>Press SPACE or W or click to jump</p>
            <p>Press DOWN or S to duck</p>
            <p id="gameStatus">Press SPACE to start</p>
        </div>
    </div>

    <div class="game-over-screen" id="gameOverScreen">
        <h2>Game Over!</h2>
        <div class="final-score" id="finalScore">0</div>
        <button class="try-again-btn" id="tryAgainBtn">Try Again?</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameStatusDisplay = document.getElementById('gameStatus');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const tryAgainBtn = document.getElementById('tryAgainBtn');

        // Game variables
        let gameActive = false;
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('trexHighScore') ? parseInt(localStorage.getItem('trexHighScore')) : 0;
        let gameSpeed = 6;
        let gravity = 0.6;

        // Dino
        const dino = {
            x: 50,
            y: 0,
            width: 40,
            height: 40,
            dy: 0,
            jumpPower: -10,
            grounded: false,
            ducking: false
        };

        // Obstacles
        let obstacles = [];
        let frameCount = 0;
        let obstacleFrequency = 90;

        // Ground
        const groundY = canvas.height - 20;
        dino.y = groundY - dino.height;

        highScoreDisplay.textContent = highScore;

        function drawDino() {
            ctx.fillStyle = '#000';
            
            if (dino.ducking) {
                // Draw ducking dino (shorter and wider)
                ctx.fillRect(dino.x, dino.y + 20, dino.width + 10, dino.height - 20);
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(dino.x + 5, dino.y + 25, 3, 3);
            } else {
                // Draw standing dino
                // Body
                ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(dino.x + 5, dino.y + 5, 3, 3);
                
                // Legs animation
                ctx.fillStyle = '#000';
                const legOffset = Math.floor(frameCount / 10) % 2;
                ctx.fillRect(dino.x + 10 + legOffset * 10, dino.y + dino.height, 5, 10);
                ctx.fillRect(dino.x + 25 - legOffset * 10, dino.y + dino.height, 5, 10);
            }
        }

        function drawObstacle(obs) {
            ctx.fillStyle = '#000';
            
            if (obs.type === 'cactus') {
                // Draw cactus
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillRect(obs.x + 5, obs.y - 10, 5, 10);
                ctx.fillRect(obs.x + obs.width - 10, obs.y - 8, 5, 8);
            } else {
                // Draw bird with horn on top
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                // Wings
                ctx.fillRect(obs.x - 5, obs.y + 5, 5, 5);
                ctx.fillRect(obs.x + obs.width, obs.y + 5, 5, 5);
                // Horn/spike on top to prevent jumping over
                ctx.fillRect(obs.x + obs.width / 2 - 2, obs.y - 25, 4, 25);
            }
        }

        function drawGround() {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Ground pattern
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillStyle = '#000';
                ctx.fillRect(i + (frameCount % 20), groundY + 2, 10, 2);
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGround();
            drawDino();

            // Draw obstacles
            obstacles.forEach(obs => drawObstacle(obs));
        }

        function update() {
            if (!gameActive) return;

            frameCount++;

            // Update score
            if (frameCount % 10 === 0) {
                score++;
                scoreDisplay.textContent = score;

                // Increase difficulty
                if (score % 100 === 0) {
                    gameSpeed += 0.5;
                }
            }

            // Dino physics
            if (!dino.grounded) {
                dino.dy += gravity;
                dino.y += dino.dy;
            }

            // Ground collision
            if (dino.y >= groundY - dino.height) {
                dino.y = groundY - dino.height;
                dino.dy = 0;
                dino.grounded = true;
            }

            // Generate obstacles
            if (frameCount % obstacleFrequency === 0) {
                const rand = Math.random();
                let obstacle;

                if (rand < 0.7) {
                    // Cactus
                    const cactusHeight = 30 + Math.random() * 20;
                    obstacle = {
                        x: canvas.width,
                        y: groundY - cactusHeight,
                        width: 20,
                        height: cactusHeight,
                        type: 'cactus'
                    };
                } else {
                    // Bird (at head height so ducking is useful)
                    const birdY = groundY - 50;
                    obstacle = {
                        x: canvas.width,
                        y: birdY,
                        width: 30,
                        height: 15,
                        type: 'bird'
                    };
                }

                obstacles.push(obstacle);
            }

            // Update obstacles
            obstacles = obstacles.filter(obs => {
                obs.x -= gameSpeed;
                return obs.x + obs.width > 0;
            });

            // Collision detection
            obstacles.forEach(obs => {
                const dinoHeight = dino.ducking ? dino.height - 20 : dino.height;
                const dinoY = dino.ducking ? dino.y + 20 : dino.y;
                
                // Check collision with obstacle body
                if (
                    dino.x < obs.x + obs.width &&
                    dino.x + dino.width > obs.x &&
                    dinoY < obs.y + obs.height &&
                    dinoY + dinoHeight > obs.y
                ) {
                    endGame();
                }
                
                // Check collision with bird horn (if it's a bird)
                if (obs.type === 'bird') {
                    const hornX = obs.x + obs.width / 2 - 2;
                    const hornY = obs.y - 25;
                    const hornWidth = 4;
                    const hornHeight = 25;
                    
                    if (
                        dino.x < hornX + hornWidth &&
                        dino.x + dino.width > hornX &&
                        dinoY < hornY + hornHeight &&
                        dinoY + dinoHeight > hornY
                    ) {
                        endGame();
                    }
                }
            });

            draw();
        }

        function jump() {
            if (dino.grounded && !dino.ducking) {
                dino.dy = dino.jumpPower;
                dino.grounded = false;
            }
        }

        function duck(isDucking) {
            if (dino.grounded) {
                dino.ducking = isDucking;
            }
        }

        function endGame() {
            if (!gameActive) return;
            
            gameActive = false;
            gameRunning = false;
            gameStatusDisplay.textContent = 'Game Over!';

            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('trexHighScore', highScore);
            }

            showGameOverScreen();
        }

        function showGameOverScreen() {
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.add('active');
        }

        function hideGameOverScreen() {
            gameOverScreen.classList.remove('active');
        }

        function startGame() {
            hideGameOverScreen();
            
            // Reset game state
            dino.y = groundY - dino.height;
            dino.dy = 0;
            dino.grounded = true;
            dino.ducking = false;
            obstacles = [];
            frameCount = 0;
            score = 0;
            gameSpeed = 6;
            scoreDisplay.textContent = score;
            
            gameActive = true;
            gameRunning = true;
            gameStatusDisplay.textContent = 'Running...';
            
            draw();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && (e.code === 'Space' || e.code === 'KeyW')) {
                startGame();
                return;
            }

            if (e.code === 'Space' || e.code === 'KeyW') {
                e.preventDefault();
                jump();
            }

            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                duck(true);
            }

            if (e.code === 'KeyR') {
                startGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                duck(false);
            }
        });

        canvas.addEventListener('click', () => {
            if (!gameRunning) {
                startGame();
            } else {
                jump();
            }
        });

        tryAgainBtn.addEventListener('click', () => {
            startGame();
        });

        // Game loop - 60 FPS
        function gameLoop() {
            update();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Initial draw
        draw();
    </script>
</body>
</html>
