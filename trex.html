<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Rex Game - dimhyena2222's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 25%, #4facfe 50%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .stat {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-label {
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            border: 4px solid #fff;
            background: linear-gradient(180deg, #87CEEB 0%, #FFE4B5 100%);
            display: block;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .controls {
            text-align: center;
            color: #fff;
            font-size: 0.9rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-link:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .game-over-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid #ff6b6b;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        .game-over-screen.active {
            display: block;
        }

        .game-over-screen h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .final-score {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .try-again-btn {
            padding: 14px 40px;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .try-again-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(79, 172, 254, 0.6);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <div class="container">
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="200"></canvas>

        <div class="controls">
            <p>Press SPACE or W or click to jump</p>
            <p>Press DOWN or S to duck</p>
            <p id="gameStatus">Press SPACE to start</p>
        </div>
    </div>

    <div class="game-over-screen" id="gameOverScreen">
        <h2>Game Over!</h2>
        <div class="final-score" id="finalScore">0</div>
        <button class="try-again-btn" id="tryAgainBtn">Try Again?</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameStatusDisplay = document.getElementById('gameStatus');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const tryAgainBtn = document.getElementById('tryAgainBtn');

        // Game variables
        let gameActive = false;
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('trexHighScore') ? parseInt(localStorage.getItem('trexHighScore')) : 0;
        let gameSpeed = 6;
        let gravity = 0.6;

        // Dino
        const dino = {
            x: 50,
            y: 0,
            width: 45,
            height: 45,
            dy: 0,
            jumpPower: -11,
            grounded: false,
            ducking: false
        };

        // Obstacles
        let obstacles = [];
        let frameCount = 0;
        let nextObstacleFrame = 90;

        // Boss
        let bossActive = false;
        let boss = {
            x: 700,
            y: 100,
            width: 60,
            height: 80,
            targetY: 100,
            health: 10
        };
        let bossLasers = [];

        // Random swooping birds
        let swoopingBirds = [];
        let nextBirdFrame = 200;

        // Ground
        const groundY = canvas.height - 20;
        dino.y = groundY - dino.height;

        highScoreDisplay.textContent = highScore;

        function drawDino() {
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff6b6b';
            
            if (dino.ducking) {
                // Draw ducking T-Rex (lower profile)
                ctx.fillRect(dino.x, dino.y + 25, dino.width + 15, dino.height - 25);
                // Head
                ctx.fillRect(dino.x + dino.width, dino.y + 20, 20, 20);
                // Eye
                ctx.fillStyle = '#fff';
                ctx.fillRect(dino.x + dino.width + 5, dino.y + 25, 4, 4);
            } else {
                // Draw standing T-Rex with bent-over posture (more horizontal)
                // Body - more horizontal and smaller
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(dino.x + 5, dino.y + 10, 28, 20);
                
                // Head - extended forward and lower
                ctx.fillRect(dino.x + 28, dino.y + 5, 18, 15);
                
                // Mouth - pointing forward
                ctx.fillStyle = '#fff';
                ctx.fillRect(dino.x + 42, dino.y + 10, 6, 3);
                
                // Teeth
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(dino.x + 42 + i * 2, dino.y + 10, 1, 4);
                }
                
                // Eye
                ctx.fillRect(dino.x + 35, dino.y + 8, 3, 3);
                
                // Arms - smaller and pointing down
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(dino.x + 15, dino.y + 15, 6, 10);
                
                // Tail - extended back and slightly up
                ctx.fillRect(dino.x - 5, dino.y + 12, 12, 8);
                ctx.fillRect(dino.x - 10, dino.y + 10, 8, 6);
                
                // Legs animation - positioned under body
                const legOffset = Math.floor(frameCount / 10) % 2;
                ctx.fillRect(dino.x + 10 + legOffset * 8, dino.y + dino.height - 10, 6, 12);
                ctx.fillRect(dino.x + 20 - legOffset * 8, dino.y + dino.height - 10, 6, 12);
            }
            ctx.shadowBlur = 0;
        }

        function drawObstacle(obs) {
            if (obs.type === 'cactus') {
                ctx.fillStyle = '#4CAF50';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#4CAF50';
                // Different cactus shapes
                if (obs.variant === 1) {
                    // Tall thin cactus
                    ctx.fillRect(obs.x + 5, obs.y, 10, obs.height);
                    ctx.fillRect(obs.x, obs.y + 10, 5, 15);
                    ctx.fillRect(obs.x + 15, obs.y + 15, 5, 10);
                } else if (obs.variant === 2) {
                    // Wide short cactus
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.fillRect(obs.x + 5, obs.y - 10, 5, 10);
                    ctx.fillRect(obs.x + obs.width - 10, obs.y - 8, 5, 8);
                } else {
                    // Triple cactus
                    ctx.fillRect(obs.x, obs.y, 8, obs.height);
                    ctx.fillRect(obs.x + 10, obs.y - 5, 8, obs.height + 5);
                    ctx.fillRect(obs.x + 20, obs.y, 8, obs.height);
                }
                ctx.shadowBlur = 0;
            } else if (obs.type === 'pterodactyl') {
                ctx.fillStyle = '#9C27B0';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#9C27B0';
                // Flying pterodactyl body
                ctx.fillRect(obs.x + 10, obs.y, obs.width - 20, obs.height);
                // Head with beak
                ctx.fillRect(obs.x + obs.width - 10, obs.y - 5, 15, 10);
                ctx.fillRect(obs.x + obs.width + 3, obs.y - 3, 8, 4);
                // Wings (animated)
                const wingFlap = Math.floor(frameCount / 5) % 2;
                ctx.fillRect(obs.x - 5, obs.y + 5 - wingFlap * 3, 15, 8);
                ctx.fillRect(obs.x + obs.width - 10, obs.y + 5 - wingFlap * 3, 15, 8);
                // Horn on head
                ctx.fillRect(obs.x + obs.width - 5, obs.y - 15, 4, 10);
                ctx.shadowBlur = 0;
            } else if (obs.type === 'rock') {
                ctx.fillStyle = '#757575';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#757575';
                // Boulder
                ctx.fillRect(obs.x + 5, obs.y, obs.width - 10, obs.height);
                ctx.fillRect(obs.x, obs.y + 5, obs.width, obs.height - 10);
                ctx.shadowBlur = 0;
            }
        }

        function drawGround() {
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Ground pattern
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(i + (frameCount % 20), groundY + 2, 10, 3);
            }
        }

        function drawBoss() {
            if (!bossActive) return;
            
            // Skeleton boss
            ctx.fillStyle = '#E0E0E0';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0000';
            
            // Skull
            ctx.fillRect(boss.x + 15, boss.y, 30, 30);
            // Eye sockets (glowing red)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(boss.x + 20, boss.y + 8, 6, 8);
            ctx.fillRect(boss.x + 34, boss.y + 8, 6, 8);
            // Teeth
            ctx.fillStyle = '#E0E0E0';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(boss.x + 18 + i * 5, boss.y + 25, 3, 5);
            }
            
            // Spine
            ctx.fillRect(boss.x + 25, boss.y + 30, 8, 40);
            // Ribs
            for (let i = 0; i < 4; i++) {
                ctx.fillRect(boss.x + 15, boss.y + 35 + i * 8, 15, 3);
                ctx.fillRect(boss.x + 33, boss.y + 35 + i * 8, 15, 3);
            }
            
            // Floating effect
            boss.y = boss.targetY + Math.sin(frameCount / 20) * 5;
            
            ctx.shadowBlur = 0;
            
            // Health bar
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(boss.x, boss.y - 20, boss.width, 5);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(boss.x, boss.y - 20, (boss.health / 10) * boss.width, 5);
        }

        function drawLasers() {
            bossLasers.forEach(laser => {
                ctx.fillStyle = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0000';
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
                ctx.shadowBlur = 0;
            });
        }

        function drawSwoopingBirds() {
            swoopingBirds.forEach(bird => {
                ctx.fillStyle = '#FF5722';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#FF5722';
                
                // Bird body
                ctx.fillRect(bird.x + 5, bird.y, 15, 10);
                // Wings
                const wingFlap = Math.floor(frameCount / 3) % 2;
                ctx.fillRect(bird.x - 5, bird.y + 3 - wingFlap * 2, 10, 6);
                ctx.fillRect(bird.x + 20, bird.y + 3 - wingFlap * 2, 10, 6);
                // Beak
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(bird.x + 18, bird.y + 3, 5, 3);
                
                ctx.shadowBlur = 0;
            });
        }

        function draw() {
            // Clear canvas with gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#FFE4B5');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGround();
            drawDino();
            drawBoss();
            drawLasers();
            drawSwoopingBirds();

            // Draw obstacles
            obstacles.forEach(obs => drawObstacle(obs));
        }

        function update() {
            if (!gameActive) return;

            frameCount++;

            // Update score
            if (frameCount % 10 === 0) {
                score++;
                scoreDisplay.textContent = score;

                // Increase difficulty
                if (score % 100 === 0) {
                    gameSpeed += 0.5;
                }
                
                // Activate boss at score 300
                if (score === 300 && !bossActive) {
                    bossActive = true;
                    gameStatusDisplay.textContent = '💀 BOSS BATTLE! 💀';
                }
            }

            // Dino physics
            if (!dino.grounded) {
                dino.dy += gravity;
                dino.y += dino.dy;
            }

            // Ground collision
            if (dino.y >= groundY - dino.height) {
                dino.y = groundY - dino.height;
                dino.dy = 0;
                dino.grounded = true;
            }

            // Boss behavior
            if (bossActive) {
                // Boss follows dino's Y position
                boss.targetY = dino.y - 30;
                if (boss.targetY < 50) boss.targetY = 50;
                if (boss.targetY > 120) boss.targetY = 120;
                
                // Smoothly move boss toward target
                const yDiff = boss.targetY - boss.y;
                boss.y += yDiff * 0.1;
                
                // Boss shoots lasers randomly
                if (frameCount % 60 === 0 && Math.random() < 0.7) {
                    const laserY = boss.y + boss.height / 2;
                    bossLasers.push({
                        x: boss.x - 10,
                        y: laserY,
                        width: 30,
                        height: 5
                    });
                }
            }

            // Update boss lasers
            bossLasers = bossLasers.filter(laser => {
                laser.x -= gameSpeed + 3;
                return laser.x > -50;
            });

            // Generate random obstacles
            if (frameCount >= nextObstacleFrame) {
                const rand = Math.random();
                let obstacle;

                if (rand < 0.4) {
                    // Cactus variants
                    const variant = Math.floor(Math.random() * 3) + 1;
                    const cactusHeight = 30 + Math.random() * 25;
                    const cactusWidth = variant === 3 ? 28 : 20;
                    obstacle = {
                        x: canvas.width,
                        y: groundY - cactusHeight,
                        width: cactusWidth,
                        height: cactusHeight,
                        type: 'cactus',
                        variant: variant
                    };
                } else if (rand < 0.7) {
                    // Pterodactyl at varying heights
                    const pteroY = groundY - 60 - Math.random() * 20;
                    obstacle = {
                        x: canvas.width,
                        y: pteroY,
                        width: 35,
                        height: 15,
                        type: 'pterodactyl'
                    };
                } else {
                    // Rock obstacle
                    const rockHeight = 25 + Math.random() * 15;
                    obstacle = {
                        x: canvas.width,
                        y: groundY - rockHeight,
                        width: 25,
                        height: rockHeight,
                        type: 'rock'
                    };
                }

                obstacles.push(obstacle);
                // Random spacing between obstacles - increased minimum distance
                nextObstacleFrame = frameCount + 90 + Math.random() * 100;
            }

            // Generate random swooping birds - only when no nearby obstacles
            if (frameCount >= nextBirdFrame && Math.random() < 0.3) {
                // Check if there's an obstacle too close (within 250 pixels)
                const nearbyObstacle = obstacles.some(obs => obs.x > canvas.width - 250);
                
                if (!nearbyObstacle) {
                    swoopingBirds.push({
                        x: canvas.width,
                        y: -20,
                        targetY: groundY - 70,
                        width: 25,
                        height: 10,
                        speed: 4 + Math.random() * 3
                    });
                }
                nextBirdFrame = frameCount + 200 + Math.random() * 250;
            }

            // Update swooping birds
            swoopingBirds = swoopingBirds.filter(bird => {
                bird.x -= bird.speed;
                // Swoop down towards target
                if (bird.y < bird.targetY) {
                    bird.y += 3;
                }
                return bird.x > -50;
            });

            // Update obstacles
            obstacles = obstacles.filter(obs => {
                obs.x -= gameSpeed;
                return obs.x + obs.width > 0;
            });

            // Collision detection with obstacles
            obstacles.forEach(obs => {
                const dinoHeight = dino.ducking ? dino.height - 20 : dino.height;
                const dinoY = dino.ducking ? dino.y + 20 : dino.y;
                const dinoWidth = dino.ducking ? dino.width + 10 : dino.width;
                
                // Slightly smaller hitbox for better gameplay (3 pixel margin)
                if (
                    dino.x + 3 < obs.x + obs.width &&
                    dino.x + dinoWidth - 3 > obs.x &&
                    dinoY + 3 < obs.y + obs.height &&
                    dinoY + dinoHeight - 3 > obs.y
                ) {
                    endGame();
                }
                
                // Check collision with pterodactyl horn
                if (obs.type === 'pterodactyl') {
                    const hornX = obs.x + obs.width - 5;
                    const hornY = obs.y - 15;
                    const hornWidth = 4;
                    const hornHeight = 10;
                    
                    if (
                        dino.x + 3 < hornX + hornWidth &&
                        dino.x + dinoWidth - 3 > hornX &&
                        dinoY + 3 < hornY + hornHeight &&
                        dinoY + dinoHeight - 3 > hornY
                    ) {
                        endGame();
                    }
                }
            });

            // Collision with boss lasers
            bossLasers.forEach(laser => {
                const dinoHeight = dino.ducking ? dino.height - 20 : dino.height;
                const dinoY = dino.ducking ? dino.y + 20 : dino.y;
                const dinoWidth = dino.ducking ? dino.width + 10 : dino.width;
                
                // 3 pixel margin for better gameplay
                if (
                    dino.x + 3 < laser.x + laser.width &&
                    dino.x + dinoWidth - 3 > laser.x &&
                    dinoY + 3 < laser.y + laser.height &&
                    dinoY + dinoHeight - 3 > laser.y
                ) {
                    endGame();
                }
            });

            // Collision with swooping birds
            swoopingBirds.forEach(bird => {
                const dinoHeight = dino.ducking ? dino.height - 20 : dino.height;
                const dinoY = dino.ducking ? dino.y + 20 : dino.y;
                const dinoWidth = dino.ducking ? dino.width + 10 : dino.width;
                
                // 3 pixel margin for better gameplay
                if (
                    dino.x + 3 < bird.x + bird.width &&
                    dino.x + dinoWidth - 3 > bird.x &&
                    dinoY + 3 < bird.y + bird.height &&
                    dinoY + dinoHeight - 3 > bird.y
                ) {
                    endGame();
                }
            });

            draw();
        }

        function jump() {
            if (dino.grounded && !dino.ducking) {
                dino.dy = dino.jumpPower;
                dino.grounded = false;
            }
        }

        function duck(isDucking) {
            if (dino.grounded) {
                dino.ducking = isDucking;
            }
        }

        function endGame() {
            if (!gameActive) return;
            
            gameActive = false;
            gameRunning = false;
            gameStatusDisplay.textContent = 'Game Over!';

            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('trexHighScore', highScore);
            }

            showGameOverScreen();
        }

        function showGameOverScreen() {
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.add('active');
        }

        function hideGameOverScreen() {
            gameOverScreen.classList.remove('active');
        }

        function startGame() {
            hideGameOverScreen();
            
            // Reset game state
            dino.y = groundY - dino.height;
            dino.dy = 0;
            dino.grounded = true;
            dino.ducking = false;
            obstacles = [];
            frameCount = 0;
            score = 0;
            gameSpeed = 6;
            scoreDisplay.textContent = score;
            
            // Reset boss
            bossActive = false;
            boss.y = 100;
            boss.targetY = 100;
            boss.health = 10;
            bossLasers = [];
            
            // Reset swooping birds
            swoopingBirds = [];
            nextBirdFrame = 200;
            nextObstacleFrame = 90;
            
            gameActive = true;
            gameRunning = true;
            gameStatusDisplay.textContent = 'Running...';
            
            draw();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && (e.code === 'Space' || e.code === 'KeyW')) {
                startGame();
                return;
            }

            if (e.code === 'Space' || e.code === 'KeyW') {
                e.preventDefault();
                jump();
            }

            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                e.preventDefault();
                duck(true);
            }

            if (e.code === 'KeyR') {
                startGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                duck(false);
            }
        });

        canvas.addEventListener('click', () => {
            if (!gameRunning) {
                startGame();
            } else {
                jump();
            }
        });

        tryAgainBtn.addEventListener('click', () => {
            startGame();
        });

        // Easter egg: Hold space to make obstacles disappear temporarily
        let spaceHoldTime = 0;
        let spaceHeld = false;
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !spaceHeld && gameActive) {
                spaceHeld = true;
                const holdInterval = setInterval(() => {
                    spaceHoldTime++;
                    if (spaceHoldTime > 30) {
                        obstacles = [];
                        gameStatusDisplay.textContent = '✨ INVINCIBLE MODE! ✨';
                        clearInterval(holdInterval);
                        setTimeout(() => {
                            gameStatusDisplay.textContent = 'Running...';
                            spaceHoldTime = 0;
                        }, 2000);
                    }
                    if (!spaceHeld) clearInterval(holdInterval);
                }, 100);
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                spaceHeld = false;
                spaceHoldTime = 0;
            }
        });

        // Easter egg: Special scores give messages
        let lastScoreMessage = 0;
        const originalUpdate = update;
        function updateWithEasterEggs() {
            originalUpdate();
            if (score === 100 && lastScoreMessage !== 100) {
                gameStatusDisplay.textContent = '💯 CENTURY!';
                lastScoreMessage = 100;
                setTimeout(() => { if (gameActive) gameStatusDisplay.textContent = 'Running...'; }, 2000);
            } else if (score === 500 && lastScoreMessage !== 500) {
                gameStatusDisplay.textContent = '🏆 LEGENDARY!';
                lastScoreMessage = 500;
                setTimeout(() => { if (gameActive) gameStatusDisplay.textContent = 'Running...'; }, 2000);
            } else if (score === 1000 && lastScoreMessage !== 1000) {
                gameStatusDisplay.textContent = '👑 MASTER OF THE DESERT!';
                lastScoreMessage = 1000;
                setTimeout(() => { if (gameActive) gameStatusDisplay.textContent = 'Running...'; }, 2000);
            }
        }
        update = updateWithEasterEggs;

        // Game loop - 60 FPS
        function gameLoop() {
            update();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Initial draw
        draw();

        // Easter egg: Click the dino to make it do a dance
        canvas.addEventListener('dblclick', (e) => {
            if (!gameActive) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x < 100) {
                    let bounces = 0;
                    const bounceInterval = setInterval(() => {
                        dino.y -= 20;
                        setTimeout(() => dino.y += 20, 100);
                        bounces++;
                        if (bounces >= 3) clearInterval(bounceInterval);
                    }, 300);
                    draw();
                }
            }
        });
    </script>
</body>
</html>
