<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dimhyena2222's Portfolio (by abriene)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f6f3;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 760px;
            padding: 56px 40px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: clamp(2.6rem, 6vw, 4rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 16px;
        }

        .description {
            max-width: 44rem;
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .link {
            display: inline-flex;
            align-items: center;
            padding: 12px 18px;
            border: 1px solid #111;
            border-radius: 999px;
            color: #111;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .link:hover {
            background: #111;
            color: #fff;
        }

        .link.placeholder {
            color: #777;
            border-color: #ddd;
            background: #fafafa;
            cursor: default;
        }

        .link.placeholder:hover {
            background: #fafafa;
            color: #777;
        }

        .meta {
            margin-top: 22px;
            color: #777;
            font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>dimhyena2222 (by abriene)</h1>
        <p class="description">Developer focused on clean interfaces, reliable code, and practical web experiences.</p>
        <nav class="links" aria-label="Primary">
            <span class="link placeholder" aria-disabled="true">Placeholder</span>
        </nav>
        <p class="meta">Minimal portfolio.</p>
    </main>
</body>
</html>
