<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dimhyena2222's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-top: 50px;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5),
                         0 0 20px rgba(255, 255, 255, 0.5),
                         0 0 40px rgba(255, 0, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .description {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 50px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f, #f06292, #ba68c8);
            color: #fff;
            text-decoration: none;
            border: 3px solid #fff;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3),
                        0 0 20px rgba(255, 107, 107, 0.5);
            animation: buttonPulse 2s infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .btn:hover {
            background: linear-gradient(45deg, #4facfe, #00f2fe, #43e97b, #38f9d7);
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4),
                        0 0 30px rgba(79, 172, 254, 0.8);
        }

        .secret-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2s infinite, rotate 4s linear infinite;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
        }

        .secret-btn:hover {
            transform: scale(1.2) rotate(15deg);
            box-shadow: 0 0 40px rgba(255, 105, 180, 1);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .growing-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #4CAF50, #8BC34A, #CDDC39);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
            text-transform: uppercase;
        }

        .growing-btn:hover {
            box-shadow: 0 0 40px rgba(76, 175, 80, 1);
        }

        .konami-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #000, #ff00ff, #00ffff);
            color: #0f0;
            padding: 30px 50px;
            border: 5px solid #0f0;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            z-index: 10000;
            animation: glitch 0.3s infinite, rainbow-border 2s linear infinite;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.8);
        }

        @keyframes glitch {
            0% { transform: translate(-50%, -50%); }
            33% { transform: translate(-51%, -49%); }
            66% { transform: translate(-49%, -51%); }
            100% { transform: translate(-50%, -50%); }
        }

        @keyframes rainbow-border {
            0% { border-color: #ff0000; }
            16% { border-color: #ff7f00; }
            33% { border-color: #ffff00; }
            50% { border-color: #00ff00; }
            66% { border-color: #0000ff; }
            83% { border-color: #8b00ff; }
            100% { border-color: #ff0000; }
        }

        .click-counter {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #fff;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 20px rgba(245, 87, 108, 0.8);
            font-weight: 700;
        }

        .click-counter.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="click-counter" id="clickCounter">Clicks: 0</div>
    <div class="konami-message" id="konamiMessage">🎮 KONAMI CODE ACTIVATED! 🎮</div>
    <div class="container">
        <h1>dimhyena2222</h1>
        
        <p class="description">
            A passionate developer and creative problem-solver with a focus on building clean, modern web experiences. Constantly learning and exploring new technologies to create meaningful digital solutions.
        </p>
        
        <div class="button-group">
            <button class="btn">View My Work</button>
            <a href="about.html" class="btn">About Me</a>
            <a href="snake.html" class="btn">Snake Game</a>
            <a href="trex.html" class="btn">T-Rex Game</a>
        </div>
    </div>
    
    <button class="growing-btn" id="growingBtn">Click Me!</button>
    <button class="secret-btn" id="secretBtn">🎉</button>

    <script>
        // Growing button easter egg
        const growingBtn = document.getElementById('growingBtn');
        let growSize = 1;
        growingBtn.addEventListener('click', () => {
            growSize += 0.1;
            growingBtn.style.transform = `scale(${growSize})`;
            if (growSize > 3) {
                growingBtn.textContent = "I'M HUGE!";
            }
            if (growSize > 5) {
                growingBtn.textContent = "STOP!!!";
            }
            if (growSize > 7) {
                growingBtn.style.transform = 'scale(1)';
                growSize = 1;
                growingBtn.textContent = "Click Me!";
            }
        });

        // Secret button that does random things
        const secretBtn = document.getElementById('secretBtn');
        const emojis = ['🎉', '🎊', '🎈', '🎁', '🦄', '🌈', '⭐', '💫', '✨', '🎮'];
        let emojiIndex = 0;
        secretBtn.addEventListener('click', () => {
            emojiIndex = (emojiIndex + 1) % emojis.length;
            secretBtn.textContent = emojis[emojiIndex];
            document.body.style.background = `hsl(${Math.random() * 360}, 70%, 95%)`;
            setTimeout(() => {
                document.body.style.background = '#f9f9f9';
            }, 500);
        });

        // Click counter
        const clickCounter = document.getElementById('clickCounter');
        let totalClicks = 0;
        document.addEventListener('click', () => {
            totalClicks++;
            clickCounter.textContent = `Clicks: ${totalClicks}`;
            clickCounter.classList.add('show');
            if (totalClicks === 100) {
                alert('🎉 Congratulations! You clicked 100 times!');
            }
        });

        // Konami code easter egg (up, up, down, down, left, right, left, right, b, a)
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let konamiIndex = 0;
        const konamiMessage = document.getElementById('konamiMessage');
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === konamiCode[konamiIndex] || e.code === konamiCode[konamiIndex]) {
                konamiIndex++;
                if (konamiIndex === konamiCode.length) {
                    konamiMessage.style.display = 'block';
                    document.body.style.transform = 'rotate(360deg)';
                    setTimeout(() => {
                        konamiMessage.style.display = 'none';
                        document.body.style.transform = 'rotate(0deg)';
                    }, 3000);
                    konamiIndex = 0;
                }
            } else {
                konamiIndex = 0;
            }
        });

        // Title changes when you leave the tab
        let originalTitle = document.title;
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.title = '👋 Come back!';
            } else {
                document.title = originalTitle;
            }
        });

        // Double-click h1 to make it rainbow
        const h1 = document.querySelector('h1');
        h1.addEventListener('dblclick', () => {
            h1.style.background = 'linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet)';
            h1.style.webkitBackgroundClip = 'text';
            h1.style.webkitTextFillColor = 'transparent';
            h1.style.backgroundClip = 'text';
            setTimeout(() => {
                h1.style.background = 'none';
                h1.style.webkitTextFillColor = '#333';
                h1.style.color = '#333';
            }, 3000);
        });
    </script>
</body>
</html>
