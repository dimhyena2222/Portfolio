<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dimhyena2222's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 500;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }
        
        .description {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 50px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border: 2px solid #000;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>dimhyena2222</h1>
        
        <p class="description">
            A passionate developer and creative problem-solver with a focus on building clean, modern web experiences. Constantly learning and exploring new technologies to create meaningful digital solutions.
        </p>
        
        <div class="button-group">
            <button class="btn">View My Work</button>
            <button class="btn">About Me</button>
            <a href="snake.html" class="btn">Snake Game</a>
            <a href="trex.html" class="btn">T-Rex Game</a>
        </div>
    </div>
</body>
</html>
