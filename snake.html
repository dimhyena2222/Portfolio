<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - dimhyena2222's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            background: rgba(0, 255, 0, 0.1);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #0f0;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.5);
        }

        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .stat {
            text-align: center;
            background: rgba(0, 255, 0, 0.2);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .stat-label {
            color: #0f0;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #0f0;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f0;
            text-shadow: 0 0 20px #0f0;
        }

        #gameCanvas {
            border: 4px solid #0f0;
            background: #000;
            display: block;
            cursor: none;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
            border-radius: 10px;
        }

        .controls {
            text-align: center;
            color: #0f0;
            font-size: 0.9rem;
            text-shadow: 0 0 10px #0f0;
        }

        .leaderboard {
            background: rgba(0, 255, 0, 0.1);
            border: 3px solid #0f0;
            padding: 20px;
            border-radius: 15px;
            min-width: 200px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
        }

        .leaderboard h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            color: #0f0;
            text-shadow: 0 0 15px #0f0;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #0f0;
            font-size: 0.95rem;
        }

        .leaderboard-entry:last-child {
            border-bottom: none;
        }

        .leaderboard-rank {
            font-weight: 700;
            margin-right: 10px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }

        .leaderboard-score {
            color: #0f0;
            font-weight: 700;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            background: rgba(0, 255, 0, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            text-shadow: 0 0 10px #0f0;
        }

        .back-link:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                gap: 30px;
            }

            .leaderboard {
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>

    <div class="container">
        <div class="game-section">
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">High Score</div>
                    <div class="stat-value" id="highScore">0</div>
                </div>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="controls">
                <p>Use arrow keys or WASD to move</p>
                <p>Press R to restart</p>
                <p id="gameStatus">Press any arrow key to start</p>
            </div>
        </div>

        <div class="leaderboard">
            <h2>Leaderboard</h2>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameStatusDisplay = document.getElementById('gameStatus');
        const leaderboardList = document.getElementById('leaderboardList');

        const GRID_SIZE = 16;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        let snake = [{ x: 8, y: 8 }];
        let food = { x: 12, y: 12 };
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') ? parseInt(localStorage.getItem('snakeHighScore')) : 0;
        let gameActive = false;
        let gameRunning = false;
        let leaderboard = JSON.parse(localStorage.getItem('snakeLeaderboard')) || [];
        let moveCounter = 0;
        const MOVE_INTERVAL = 8; // Update movement every 8 frames for smoother animation

        highScoreDisplay.textContent = highScore;
        updateLeaderboard();

        function generateFood() {
            let newFood;
            let validPosition = false;
            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                validPosition = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }
            food = newFood;
        }

        function drawSnakeSegment(x, y, isHead, direction) {
            const padding = 1;
            const size = CELL_SIZE - 2 * padding;

            if (isHead) {
                // Draw head with glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#0f0';
                ctx.fillStyle = '#0f0';
                ctx.beginPath();
                ctx.roundRect(x * CELL_SIZE + padding, y * CELL_SIZE + padding, size, size, 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw eyes
                ctx.fillStyle = '#000';
                const eyeSize = 2;
                const eyeOffset = 4;

                if (direction.x === 1) { // Right
                    ctx.fillRect(x * CELL_SIZE + eyeOffset + 4, y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(x * CELL_SIZE + eyeOffset + 4, y * CELL_SIZE + eyeOffset + 6, eyeSize, eyeSize);
                } else if (direction.x === -1) { // Left
                    ctx.fillRect(x * CELL_SIZE + eyeOffset, y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(x * CELL_SIZE + eyeOffset, y * CELL_SIZE + eyeOffset + 6, eyeSize, eyeSize);
                } else if (direction.y === -1) { // Up
                    ctx.fillRect(x * CELL_SIZE + eyeOffset, y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                    ctx.fillRect(x * CELL_SIZE + eyeOffset + 6, y * CELL_SIZE + eyeOffset, eyeSize, eyeSize);
                } else if (direction.y === 1) { // Down
                    ctx.fillRect(x * CELL_SIZE + eyeOffset, y * CELL_SIZE + eyeOffset + 4, eyeSize, eyeSize);
                    ctx.fillRect(x * CELL_SIZE + eyeOffset + 6, y * CELL_SIZE + eyeOffset + 4, eyeSize, eyeSize);
                }
            } else {
                // Draw body segments with green gradient
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0a0';
                ctx.fillStyle = '#0a0';
                ctx.beginPath();
                ctx.roundRect(x * CELL_SIZE + padding, y * CELL_SIZE + padding, size, size, 1);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#0a0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw food with glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0f0';
            ctx.fillStyle = '#0f0';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                const segDirection = isHead ? direction : { x: 0, y: 0 };
                drawSnakeSegment(segment.x, segment.y, isHead, segDirection);
            });
        }

        function update() {
            if (!gameActive) return;

            moveCounter++;

            if (moveCounter % MOVE_INTERVAL === 0) {
                direction = nextDirection;

                const head = snake[0];
                let newHead = {
                    x: head.x + direction.x,
                    y: head.y + direction.y
                };

                // Wall collision
                if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                    endGame();
                    return;
                }

                // Self collision
                if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                    endGame();
                    return;
                }

                snake.unshift(newHead);

                // Food collision
                if (newHead.x === food.x && newHead.y === food.y) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    generateFood();
                } else {
                    snake.pop();
                }
            }

            draw();
        }

        function endGame() {
            if (!gameActive) return; // Prevent multiple calls
            
            gameActive = false;
            gameRunning = false;
            gameStatusDisplay.textContent = 'Game Over!';

            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }

            addToLeaderboard(score);
            gameStatusDisplay.textContent = 'Game Over! Press R or arrow key to restart';
        }

        function addToLeaderboard(newScore) {
            const timestamp = new Date().toLocaleString();
            leaderboard.push({ score: newScore, date: timestamp });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('snakeLeaderboard', JSON.stringify(leaderboard));
            updateLeaderboard();
        }

        function updateLeaderboard() {
            leaderboardList.innerHTML = '';
            leaderboard.forEach((entry, index) => {
                const entryDiv = document.createElement('div');
                entryDiv.className = 'leaderboard-entry';
                entryDiv.innerHTML = `
                    <div>
                        <span class="leaderboard-rank">#${index + 1}</span>
                        <span class="leaderboard-score">${entry.score}</span>
                    </div>
                `;
                leaderboardList.appendChild(entryDiv);
            });
        }

        function startGame() {
            // Reset all game state
            snake = [{ x: 8, y: 8 }];
            generateFood();
            direction = { x: 0, y: 0 };
            nextDirection = { x: 0, y: 0 };
            score = 0;
            scoreDisplay.textContent = score;
            moveCounter = 0;
            gameActive = true;
            gameRunning = true;
            gameStatusDisplay.textContent = 'Game running...';
            draw();
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            if (!gameRunning && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                startGame();
                return;
            }

            if (key === 'r') {
                startGame();
                return;
            }

            if ((key === 'arrowup' || key === 'w') && direction.y === 0) {
                nextDirection = { x: 0, y: -1 };
            } else if ((key === 'arrowdown' || key === 's') && direction.y === 0) {
                nextDirection = { x: 0, y: 1 };
            } else if ((key === 'arrowleft' || key === 'a') && direction.x === 0) {
                nextDirection = { x: -1, y: 0 };
            } else if ((key === 'arrowright' || key === 'd') && direction.x === 0) {
                nextDirection = { x: 1, y: 0 };
            }
        });

        // Game loop - 60 FPS
        let lastTime = Date.now();
        function gameLoop() {
            update();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Easter egg: Type "rainbow" to make the snake rainbow
        let typedKeys = [];
        document.addEventListener('keypress', (e) => {
            typedKeys.push(e.key);
            if (typedKeys.length > 7) typedKeys.shift();
            
            if (typedKeys.join('') === 'rainbow') {
                alert('🌈 Rainbow mode activated! (Just kidding, but you found the secret!)');
                typedKeys = [];
            }
        });

        // Easter egg: Score 69 or 420 gives special message
        const originalUpdate = update;
        function updateWithEasterEggs() {
            originalUpdate();
            if (score === 69 && gameActive) {
                gameStatusDisplay.textContent = 'Nice. 😎';
            } else if (score === 420 && gameActive) {
                gameStatusDisplay.textContent = 'Blazing! 🔥';
            } else if (score % 100 === 0 && score > 0 && gameActive) {
                gameStatusDisplay.textContent = `${score} points! You're on fire! 🔥`;
            }
        }
        update = updateWithEasterEggs;
    </script>
</body>
</html>
